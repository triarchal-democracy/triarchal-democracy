   <g id="text_1">
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(221.655 74.02092)">Triarchal Democracy — the governance model itself:</text>
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(276.57375 86.91408)">an idea, not an organisation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(222.241406 164.614312)">Triarchal Framework — the open-source software</text>
    <text style="font-size: 10px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(207.305469 177.956312)">that provides a platform to network governance publicly</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(218.899563 294.602207)">The Triarc — the nonprofit that develops and stewards</text>
    <text style="font-size: 9.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(232.539109 307.143687)">Triarchal Framework, and governs itself through</text>
    <text style="font-size: 9.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(285.201141 319.83498)">its own deployment of it</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(173.087188 381.74927)">Federation Compact — governs relationships between independent deployments</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(206.353938 393.63048)">of Triarchal Framework; dormant until ratified by more than one</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(214.649313 429.65127)">The Triarc stewards Triarchal Framework and governs itself;</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(180.0275 441.53248)">it does not govern any other deployment that may someday run the software.</text>
   </g>
   <g id="text_6">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #8a857b" x="443.304" y="119.722984" transform="rotate(-0 443.304 119.722984)">made concrete by</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(402.095125 230.1503)">develops, stewards</text>
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(416.739609 238.7417)">&amp; runs on</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: start; fill: #1c1a17" x="37.224" y="26.698" transform="rotate(-0 37.224 26.698)">Three names, three distinct things</text>
  </g>
  <g id="text_9">
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(37.224 470.318938)">The model is the idea. Triarchal Framework is the software. The Triarc is the nonprofit that develops and stewards it — and,</text>
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(37.224 481.051828)">like any deployment, governs itself by running its own instance of it.</text>
  </g>
 </g>
