   <g id="text_3">
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(117.24825 96.198)">Accountability arrives only</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(120.898312 107.730675)">every few years, never in</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(101.101875 119.20245)">between — needs to be continuous</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #7a2e2e" x="376.704" y="74.366" transform="rotate(-0 376.704 74.366)">Opaque</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(319.37925 96.24)">Reasoning disclosed after the</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(318.152719 107.772675)">fact, not during — needs to be</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(353.654531 119.24445)">transparent</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(206.184937 319.686)">No mechanism ties representative</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(197.482406 331.0239)">behaviour to real-time consequence —</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #4a463f" transform="translate(209.431406 342.3618)">needs to be directly accountable</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #7a2e2e" x="273.024" y="378.494" transform="rotate(-0 273.024 378.494)">Disconnected</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: start; fill: #1c1a17" x="38.016" y="26.388" transform="rotate(-0 38.016 26.388)">Why current governance structurally fails</text>
  </g>
  <g id="text_9">
   <text style="font-style: italic; font-size: 7.3px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(38.016 417.970844)">Three converging causes, not three separate problems — each is a design property of representative systems built for a</text>
   <text style="font-style: italic; font-size: 7.3px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(38.016 428.556072)">world where continuous participation was logistically impossible. (The social-support system's own, separate problem — support</text>
   <text style="font-style: italic; font-size: 7.3px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(38.016 439.1413)">tied to need, so getting ahead costs you support — is not something this model sets out to change. It starts alongside those programmes.)</text>
  </g>
 </g>
