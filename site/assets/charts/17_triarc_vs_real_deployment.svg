   <g id="text_1">
    <text style="font-size: 10.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(275.282031 63.51237)">The Triarc — the online</text>
    <text style="font-size: 10.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(304.833672 77.57963)">experiment</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(520.101234 63.427901)">A real deployment — the</text>
    <text style="font-size: 10.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(552.914031 77.664099)">application</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: end; fill: #7a2e2e" x="160.992" y="154.478" transform="rotate(-0 160.992 154.478)">Purpose</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(259.362687 136.53879)">Prove the mechanism itself works —</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(260.096937 148.21727)">delegation, the ledger, disputes, the</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(268.286438 160.036)">dividend arithmetic — in public,</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(303.467875 171.77696)">cheaply, safely</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(502.60225 136.57003)">Prove the mechanism helps govern an</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(505.044938 148.38876)">actual place, where people live, work</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(519.59725 160.06724)">and pay taxes. That is the real</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(568.286 171.88597)">thesis</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: end; fill: #7a2e2e" x="160.992" y="223.5548" transform="rotate(-0 160.992 223.5548)">Membership</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(271.360937 211.524955)">Verified members online, self-</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(262.846937 223.265915)">selected, and few of them to begin</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(324.116938 235.084645)">with</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(519.153125 211.524955)">Verified residents of an actual</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(516.098563 223.203435)">municipality — typically tens or</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(513.066 235.084645)">hundreds of thousands of people</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: end; fill: #7a2e2e" x="160.992" y="292.553506" transform="rotate(-0 160.992 292.553506)">Funding</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(257.608187 286.40211)">Voluntary donations and grants only,</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(271.546562 298.22084)">and modest sums at this stage</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(501.128938 280.461505)">A real tax-supported municipal budget</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(510.07125 292.342715)">— orders of magnitude larger than</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(512.305625 304.161445)">anything the Triarc will ever hold</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: end; fill: #7a2e2e" x="160.992" y="361.630306" transform="rotate(-0 160.992 361.630306)">Dividend today</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(267.260688 343.53522)">None. Both tiers stay gated until</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(263.556438 355.41643)">thirty verified Members and every</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(265.268312 367.29764)">Delegate Position filled (Treasury</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(314.969063 379.24133)">Code 5.1)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(515.076937 349.66167)">Meaningful only once delegated</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(506.283125 361.4804)">authority and treasury scale are real</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(521.571063 373.29913)">— and still modest even then</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: end; fill: #7a2e2e" x="160.992" y="430.7852" transform="rotate(-0 160.992 430.7852)">Failure mode</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(259.9395 424.594595)">A mechanism breaks or gets gamed.</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(262.877187 436.475805)">Cheap, safe, expected, correctable</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(508.262438 412.829105)">A mechanism fails after real budget</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(514.37775 424.647835)">authority has been handed over.</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(502.78375 436.466565)">Expensive and consequential — which</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(520.028313 448.145045)">is why the handover is staged</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #7a2e2e" transform="translate(98.742094 487.049025)">What success</text>
    <text style="font-size: 9.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #7a2e2e" transform="translate(118.489094 500.276575)">looks like</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(264.892938 487.57356)">The mechanics hold under real, if</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(308.633062 499.25204)">modest, use</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(512.261625 481.59407)">A community's residents get real,</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(508.050688 493.4128)">measurable value. This is the actual</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(542.898 505.09128)">claim being tested</text>
   </g>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #1c1a17" x="374.4" y="25.4" transform="rotate(-0 374.4 25.4)">Two different things share one model — do not confuse their scale</text>
  </g>
  <g id="text_22">
   <text style="font-style: italic; font-size: 7.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(33.696 540.095125)">The Triarc exists to prove the model works, not to demonstrate it at real-world financial scale. A governance model that will one day ask a</text>
   <text style="font-style: italic; font-size: 7.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(33.696 551.126406)">community for its trust should first be willing to run on itself, in public, where every failure is visible and the cost of one falls on its own</text>
   <text style="font-style: italic; font-size: 7.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(33.696 562.087744)">credibility rather than on a public budget or a resident's income. A small dividend at Triarc scale, once the gate is met at all, is not the</text>
   <text style="font-style: italic; font-size: 7.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(33.696 573.119025)">model failing — it is the experiment behaving exactly as designed.</text>
  </g>
 </g>
 <defs>
  <clipPath id="pc33d1c805f">
   <rect x="0" y="0" width="748.8" height="590.4"/>
  </clipPath>
 </defs>
</svg>
