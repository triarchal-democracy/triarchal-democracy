   <g id="text_1">
    <text style="font-size: 12.5px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #ffffff" x="356.328" y="76.105391" transform="rotate(-0 356.328 76.105391)">Member — one vote, always, never changes</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(250.245 164.79342)">Civic Steward — sustained Contribution Record</text>
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(306.984 177.53358)">plus sector delegation</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(62.227594 259.798087)">Recognition lapses</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(52.219125 271.139242)">automatically if support</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(67.233469 282.420757)">drops below the</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(68.414719 293.628038)">sustaining floor</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(249.606 264.14268)">Delegate (Position) — compensated; installed by</text>
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(253.4655 277.104)">Position-decision vote at three-fifths majority</text>
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(295.08075 290.06532)">with one-fifth participation</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(567.360281 259.827907)">Challenge: conduct or</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(569.252906 271.109422)">eligibility — goes to a</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(562.044656 282.450578)">random Dispute Panel of</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(571.544531 293.598217)">11, excluding parties</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(253.44525 381.43692)">Supporting Nominees — operational role only,</text>
    <text style="font-size: 9.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(272.871 394.33008)">no vote share, no delegated authority</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(579.255469 370.758727)">Challenge: fit or</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(567.043313 382.040242)">legitimacy — goes to a</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(566.058281 393.321757)">community vote at the</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(556.105594 404.603273)">Position-decision threshold</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #8a857b" x="444.528" y="122.877031" transform="rotate(-0 444.528 122.877031)">delegation, earned trust</text>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #8a857b" x="448.056" y="220.270984" transform="rotate(-0 448.056 220.270984)">above community threshold</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #8a857b" x="462.168" y="331.34" transform="rotate(-0 462.168 331.34)">nominate, sector record required</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: start; fill: #1c1a17" x="31.752" y="23.17" transform="rotate(-0 31.752 23.17)">The governance hierarchy — earned, visible, never a second vote</text>
  </g>
  <g id="text_12">
   <text style="font-style: italic; font-size: 7.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(31.752 446.738)">Standing accumulates upward through earned trust and delegation; authority — one Member, one vote — never moves.</text>
   <text style="font-style: italic; font-size: 7.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(31.752 457.769281)">Every level below the Member is contestable, revocable, and lapses automatically if the support beneath it lapses.</text>
  </g>
