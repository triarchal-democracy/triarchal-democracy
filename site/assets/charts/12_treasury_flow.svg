   <g id="text_1">
    <text style="font-size: 9.2px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #1c1a17" x="282.24" y="56.658688" transform="rotate(-0 282.24 56.658688)">Donations, grants, and community-voted revenue</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(471.680125 45.58715)">Delegated-Authority Mechanism public funds —</text>
    <text style="font-size: 8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(500.6795 56.38825)">only if the government explicitly</text>
    <text style="font-size: 8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(515.956375 67.18935)">designates them for this</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #ffffff" x="282.24" y="122.274812" transform="rotate(-0 282.24 122.274812)">Treasury</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(40.822766 105.238939)">Institutional money,</text>
    <text style="font-size: 8.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(39.202875 116.789061)">incl. the Triarc's own</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(142.914 208.90476)">Operations</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(156.870937 220.58324)">40%</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(278.516813 202.86279)">Dividend pool</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(263.93975 214.60375)">(pooled, sources stay</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(263.362938 226.48496)">tagged on the ledger)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(477.012687 208.803395)">Reserve — 20%</text>
    <text style="font-size: 8.8px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(472.157562 220.544355)">(12-month target)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(93.577281 298.979346)">Foundation Dividend — split equally among</text>
    <text style="font-size: 8.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(90.031797 310.529469)">every Member, plus anything the ceiling held</text>
    <text style="font-size: 8.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #ffffff" transform="translate(97.582328 322.079591)">back last month; recalculated every cycle</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(411.274719 299.085879)">Civic Dividend — divided by claimed</text>
    <text style="font-size: 8.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(398.341797 310.636001)">contribution; no Member's total from both</text>
    <text style="font-size: 8.6px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(409.636016 322.110121)">tiers passes five times an equal share</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 8.2px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #c98f8f" x="351.036" y="370.656" transform="rotate(-0 351.036 370.656)">Not treasury money until it is released</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(144.963656 398.143485)">A redirected government programme keeps paying everyone already on it, through the government itself.</text>
    <text style="font-size: 8.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #1c1a17" transform="translate(150.382969 409.48464)">Money enters the dividend pool only as those obligations end (Government Adoption Compact 7.2, 7.3).</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(19.794622 160.0727)">restricted to</text>
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(22.370747 168.6641)">operations</text>
   </g>
   <g id="text_13">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: start; fill: #8a857b" x="451.584" y="134.000953" transform="rotate(-0 451.584 134.000953)">only if designated</text>
   </g>
   <g id="text_14">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(154.308969 248.429602)">taken first: half</text>
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(163.526016 258.036305)">by default</text>
   </g>
   <g id="text_15">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #8a857b" x="465.696" y="253.274" transform="rotate(-0 465.696 253.274)">the rest</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: start; fill: #1c1a17" x="38.808" y="22.5632" transform="rotate(-0 38.808 22.5632)">Where the money goes, and what it can never fund</text>
  </g>
  <g id="text_17">
   <text style="font-style: italic; font-size: 7.2px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(38.808 448.71075)">The Foundation Dividend activates once a deployment has at least 30 verified Members and every Delegate Position it has defined is</text>
   <text style="font-style: italic; font-size: 7.2px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(38.808 459.206775)">filled by ratified Position decision (Treasury Code 5.1); before that the formula computes zero and neither tier distributes. Institutional</text>
   <text style="font-style: italic; font-size: 7.2px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(38.808 469.657463)">money, including the Triarc's own, funds operations only and never touches the dividend pool (Treasury Code 1.4). Nothing income-tested</text>
   <text style="font-style: italic; font-size: 7.2px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(38.808 480.10815)">is ever paid out of the treasury: payments owed to people on a redirected programme stay with the government that owes them.</text>
  </g>
 </g>
