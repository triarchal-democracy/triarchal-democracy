  <g id="text_3">
   <text style="font-weight: 700; font-size: 14.5px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; text-anchor: middle; fill: #1c1a17" x="273.6" y="24.628" transform="rotate(-0 273.6 24.628)">Unmanaged delegation concentrates fast</text>
  </g>
  <g id="text_4">
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(30.096 322.502938)">Germany's Pirate Party, LiquidFeedback platform, 2010–2013: of 14,964 delegations recorded, 38 individuals received over 100</text>
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(30.096 333.243922)">each — at least a quarter of all delegated votes, concentrated among a tiny fraction of participants, with no renewal requirement</text>
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(30.096 344.031503)">to reset it. Source: Kling et al., “Voting Behaviour and Power in Online Democracy” (arXiv:1503.07723), 2015.</text>
