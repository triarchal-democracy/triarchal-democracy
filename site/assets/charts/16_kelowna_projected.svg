  </g>
  <g id="text_16">
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(34.056 347.659969)">ILLUSTRATIVE MODEL applied to Kelowna's real $204.3M tax-supported operating budget. Wage-share-within-category and the 4%/yr</text>
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(34.056 359.227152)">attrition rate are modelled assumptions, not published city figures. Even the most expansive stance modelled here comes to under $9/month per</text>
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(34.056 369.968136)">resident from this single lever — and that is the whole of what a municipality-only deployment supports. The converged figure needs the federal</text>
   <text style="font-style: italic; font-size: 7.4px; font-family: 'Lora', 'Newsreader', 'Georgia', 'DejaVu Serif', serif; fill: #8a857b" transform="translate(34.056 380.70912)">payroll tier as well; neither tier counts any redirected transfer payment.</text>
  </g>
